info:
  name: Create Location
  type: http
  seq: 1

http:
  method: POST
  url: '{{local}}/companies/{{companyId}}/locations'
  body:
    type: json
    data: |-
      {
        "city": "Lagos",
        "state": "Lagos State",
        "country": "Nigeria",
        "address": "14 Admiralty Way, Lekki",
        "is_headquarters": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
