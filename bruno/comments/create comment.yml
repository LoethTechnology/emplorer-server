info:
  name: Create Comment
  type: http
  seq: 1

http:
  method: POST
  url: '{{local}}/reviews/{{reviewId}}/comments'
  body:
    type: json
    data: |-
      {
        "body": "Even this review was helpful too.",
        "parent_comment_id": "{{commentId}}" //optional
      }
  auth: inherit

settings:
