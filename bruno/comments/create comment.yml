info:
  name: Create Comment
  type: http
  seq: 1

http:
  method: POST
  url: '{{local}}/reviews/{{reviewId}}/comments'
  body:
    type: json
    data: |-
      {
        "body": "This review was helpful.",
        "parent_comment_id": "{{commentId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
