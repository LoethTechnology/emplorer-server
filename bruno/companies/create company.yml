info:
  name: Create Company
  type: http
  seq: 1

http:
  method: POST
  url: '{{local}}/companies'
  body:
    type: multipartForm
    data:
      - name: name
        value: Acme Inc.
        type: text
        enabled: true
      - name: description
        value: A technology company.
        type: text
        enabled: true
      - name: website_url
        value: https://acme.com
        type: text
        enabled: true
      - name: domain
        value: acme.com
        type: text
        enabled: true
      - name: linkedin_url
        value: https://linkedin.com/company/acme
        type: text
        enabled: true
      - name: headquarters
        value: Lagos, Nigeria
        type: text
        enabled: true
      - name: industry
        value: Technology
        type: text
        enabled: true
      - name: logo
        value: ''
        type: file
        enabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
