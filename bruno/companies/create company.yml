info:
  name: Create Company
  type: http
  seq: 1

http:
  method: POST
  url: '{{local}}/companies'
  body:
    type: json
    data: |-
      {
        "name": "Acme Inc.",
        "description": "A technology company.",
        "website_url": "https://acme.com",
        "domain": "acme.com",
        "linkedin_url": "https://linkedin.com/company/acme",
        "logo_url": "https://acme.com/logo.png",
        "headquarters": "Lagos, Nigeria",
        "industry": "Technology"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
