info:
  name: Create Company
  type: http
  seq: 1

http:
  method: POST
  url: '{{local}}/companies'
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Acme Inc
      - name: description
        type: text
        value: Company description
      - name: website_url
        type: text
        value: https://acme.com
      - name: linkedin_url
        type: text
        value: https://linkedin.com/company/acme
      - name: address
        type: text
        value: 14 Admiralty Way, Lekki
      - name: country
        type: text
        value: Nigeria
      - name: industry
        type: text
        value: Technology
      - name: logo
        type: file
        value:
          - /Users/macbookpro15/Downloads/WhatsApp Image 2026-07-07 at 19.40.43.jpeg
        contentType: image/jpeg
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
