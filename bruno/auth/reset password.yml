info:
  name: Reset Password
  type: http
  seq: 3

http:
  method: POST
  url: '{{local}}/auth/reset-password'
  body:
    type: json
    data: |-
      {
        "email": "test@test.com",
        "otp": "123456",
        "newPassword": "newPassword123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
