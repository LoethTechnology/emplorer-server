        - name: content-type
          value: application/json; charset=utf-8
        - name: content-length
          value: '79'
        - name: etag
          value: W/"4f-MZzPbhpf7s6q4L6vIBkDG8ZJ/Dg"
        - name: date
          value: Tue, 21 Jul 2026 18:14:05 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
      body:
        type: json
        data: |-
          {
            "message": "Auth OTP created successfully.",
            "code": 201,
            "data": {
              "otp": "358684"
            }
          }
